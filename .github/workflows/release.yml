# Publishes a release when a version tag is pushed:
#
#   echo 1.2.0 > VERSION   # and a "## 1.2.0" section in CHANGELOG.md
#   git commit -am "Mouse Master 1.2.0" && git tag v1.2.0 && git push origin main v1.2.0
#
# The app is signed with Developer ID, notarized and attached to the GitHub release;
# installed copies find it within a few hours and offer to update. Run it by hand
# (Actions → Release → Run workflow) to build and notarize without publishing.
#
# Secrets: DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD (the certificate) and
# NOTARY_API_KEY_BASE64, NOTARY_API_KEY_ID, NOTARY_API_ISSUER_ID (an App Store Connect
# API key), or NOTARY_APPLE_ID and NOTARY_PASSWORD (an app-specific password) instead.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && '--publish' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -v -i -e beta -e release_candidate | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Check the tag
        if: env.PUBLISH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME is already published"
            echo "ALREADY_PUBLISHED=1" >> "$GITHUB_ENV"
          fi

      - name: Test
        if: env.ALREADY_PUBLISHED != '1'
        run: swift test

      - name: Import the Developer ID certificate
        if: env.ALREADY_PUBLISHED != '1'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::error::The DEVELOPER_ID_P12_BASE64 secret is missing"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning

      - name: Notarization credentials
        if: env.ALREADY_PUBLISHED != '1'
        env:
          KEY: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
        run: |
          if [[ -n "$KEY" ]]; then
            printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          elif [[ -z "$APPLE_ID" ]]; then
            echo "::error::Add the NOTARY_API_KEY_* secrets (or NOTARY_APPLE_ID and NOTARY_PASSWORD)"
            exit 1
          fi

      - name: Build, notarize and publish
        if: env.ALREADY_PUBLISHED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: scripts/release.sh $PUBLISH

      - uses: actions/upload-artifact@v4
        if: env.ALREADY_PUBLISHED != '1'
        with:
          name: Mouse-Master
          path: build/release/
          if-no-files-found: error

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
